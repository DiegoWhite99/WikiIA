# Publica en GitHub Pages el calendario de lanzamientos (wikiia.ics) y su página.
# Corre solo cada vez que haces git push con la base o el código cambiados, o a mano desde la pestaña Actions.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# OJO: si Source queda en "Deploy from a branch", GitHub publica el repo tal cual DESPUÉS de este workflow
# y el calendario desaparece (wikiia.ics da 404).
name: Publicar calendario

on:
  push:
    branches: [main]
    paths:  # solo lo que cambia el calendario (no cada cambio de versión de la app)
      - "wikiia.db"
      - "wikiia/calendario.py"
      - "wikiia/enlaces.py"
      - "wikiia/heuristicas.py"
      - "wikiia/db.py"
      - "wikiia/config.py"
      - ".github/workflows/calendario.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generar calendario y página
        run: python -m wikiia.calendario --carpeta _site

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir los archivos
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5

      - name: Mostrar el enlace en el resumen
        run: |
          echo "### 📅 Calendario publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Página: ${{ steps.despliegue.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suscripción: ${{ steps.despliegue.outputs.page_url }}wikiia.ics" >> "$GITHUB_STEP_SUMMARY"
